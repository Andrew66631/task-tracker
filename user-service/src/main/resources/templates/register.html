<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — Task Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <h1>Регистрация</h1>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="username">Логин:</label>
                <input type="text" id="username" th:field="*{username}" required minlength="3">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" th:field="*{password}" required minlength="6">
            </div>

            <div class="form-group">
                <label for="fullName">Полное имя:</label>
                <input type="text" id="fullName" th:field="*{fullName}">
            </div>

            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </form>

        <div class="alert alert-info" style="margin-top: 20px;">
            После регистрации ваша заявка будет отправлена администратору на одобрение.
            Роль будет назначена администратором.
        </div>

        <p class="text-center">
            Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
        </p>
    </div>
</div>

</body>
</html>
