<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${mode == 'edit'} ? 'Редактирование проекта' : 'Новый проект'">Проект</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>

<div class="container-narrow">
    <div class="card">

        <h1 th:text="${mode == 'edit'} ? 'Редактирование' : 'Новый проект'">Проект</h1>
        <p class="subtitle">Заполните название и описание</p>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <!-- Создание -->
        <form th:if="${mode == 'create'}"
              th:action="@{/projects}"
              th:object="${project}"
              method="post">

            <div class="form-group">
                <label for="name">Название</label>
                <input type="text" id="name" class="form-control"
                       th:field="*{name}" required autofocus
                       placeholder="Например, «Редизайн сайта»"/>
            </div>

            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" class="form-control"
                          th:field="*{description}"
                          placeholder="Кратко опишите, о чём проект"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Создать</button>
                <a class="btn btn-secondary" th:href="@{/projects}">Отмена</a>
            </div>
        </form>

        <!-- Редактирование -->
        <form th:if="${mode == 'edit'}"
              th:action="@{/projects/{id}(id=${projectId})}"
              th:object="${project}"
              method="post">

            <div class="form-group">
                <label for="name">Название</label>
                <input type="text" id="name" class="form-control"
                       th:field="*{name}" required autofocus/>
            </div>

            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" class="form-control"
                          th:field="*{description}"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a class="btn btn-secondary" th:href="@{/projects/{id}(id=${projectId})}">Отмена</a>
            </div>
        </form>

    </div>
</div>

</body>
</html>
