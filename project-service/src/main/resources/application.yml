server:
  port: 8083

spring:
  application:
    name: project-service

  # ===== БАЗА ДАННЫХ =====
  datasource:
    url: jdbc:postgresql://localhost:5432/tasktracker
    username: tasktracker
    password: tasktracker123
    driver-class-name: org.postgresql.Driver

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===== FLYWAY =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_projects

  # ===== THYMELEAF =====
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  # ===== KAFKA =====
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: project-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": "*"
        "[spring.json.value.default.type]": "com.tasktracker.common.event.UserCreatedEvent"

# ===== JWT =====
jwt:
  secret: mySecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm
  cookie-name: jwt-token

# ===== ЛОГИРОВАНИЕ =====
logging:
  level:
    com.tasktracker: DEBUG
    org.hibernate.SQL: DEBUG