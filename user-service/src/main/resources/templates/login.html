<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход — Task Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <h1>Вход в систему</h1>

        <div th:if="${param.registered}" class="alert alert-success">
            Регистрация успешна! Войдите в систему.
        </div>

        <div th:if="${param.logout}" class="alert alert-info">
            Вы вышли из системы.
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/login}" th:object="${loginRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="username">Логин:</label>
                <input type="text" id="username" th:field="*{username}" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" th:field="*{password}" required>
            </div>

            <button type="submit" class="btn btn-primary">Войти</button>
        </form>

        <p class="text-center">
            Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
        </p>
    </div>
</div>

</body>
</html>
