<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Профиль — Task Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
    <div class="header-container">
        <a href="/" class="logo">📋 Task Tracker</a>
        <nav class="nav">
            <a th:href="@{/profile}" class="nav-link">Профиль</a>

            <!-- ✅ Только для ADMIN -->
            <a th:if="${isAdmin}" th:href="@{/admin}" class="nav-link">Админ-панель</a>

            <a th:href="@{/logout}" class="nav-link nav-link-logout">Выйти</a>
        </nav>
    </div>
</header>

<!-- ===== MAIN ===== -->
<div class="main-container">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="sidebar-section">
            <h3>Меню</h3>
            <ul class="sidebar-menu">
                <li><a th:href="@{/profile}">👤 Мой профиль</a></li>

                <!-- ✅ Только для ADMIN -->
                <li th:if="${isAdmin}">
                    <a th:href="@{/admin}">👥 Админ-панель</a>
                </li>

                <li><a th:href="@{/projects}">📁 Проекты</a></li>
                <li><a th:href="@{/tasks}">✅ Задачи</a></li>
            </ul>
        </div>
    </aside>

    <!-- ===== CONTENT ===== -->
    <main class="content">

        <div class="profile-header">
            <div class="profile-avatar">
                <span th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}">U</span>
            </div>
            <div class="profile-header-info">
                <h1 th:text="${user.fullName != null ? user.fullName : user.username}">Имя</h1>
                <p class="profile-username" th:text="'@' + ${user.username}">@username</p>
            </div>
        </div>

        <div class="profile-card">
            <h2>Информация</h2>
            <table class="profile-table">
                <tr>
                    <td class="label">Логин:</td>
                    <td th:text="${user.username}">username</td>
                </tr>
                <tr>
                    <td class="label">Email:</td>
                    <td th:text="${user.email}">email</td>
                </tr>
                <tr>
                    <td class="label">Полное имя:</td>
                    <td th:text="${user.fullName != null ? user.fullName : '—'}">fullName</td>
                </tr>
                <tr>
                    <td class="label">Роль:</td>
                    <td>
                        <span class="badge badge-role" th:text="${user.roleName}">role</span>
                    </td>
                </tr>
                <tr>
                    <td class="label">Подроль:</td>
                    <td>
                        <span class="badge badge-subrole"
                              th:text="${user.subRoleName != null ? user.subRoleName : '—'}">subRole</span>
                    </td>
                </tr>
                <tr>
                    <td class="label">Статус:</td>
                    <td>
                        <span class="badge badge-status"
                              th:classappend="' badge-' + ${#strings.toLowerCase(user.status)}"
                              th:text="${user.statusName}">status</span>
                    </td>
                </tr>
                <tr>
                    <td class="label">Дата регистрации:</td>
                    <td th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy HH:mm')}">createdAt</td>
                </tr>
            </table>
        </div>

    </main>

</div>

</body>
</html>
